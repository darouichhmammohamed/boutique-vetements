<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card border-0 shadow-sm">
      <div class="card-body p-4">
        <h1 class="h3 fw-bold mb-4 text-center">Connexion</h1>

        @if (sessionExpiree) {
          <div class="alert alert-warning small">Votre session a expiré, merci de vous reconnecter.</div>
        }
        @if (erreur()) {
          <div class="alert alert-danger small">{{ erreur() }}</div>
        }

        <form [formGroup]="formulaire" (ngSubmit)="connecter()" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" autocomplete="email"
                   [class.is-invalid]="formulaire.controls.email.touched && formulaire.controls.email.invalid">
            <div class="invalid-feedback">Saisissez un email valide.</div>
          </div>
          <div class="mb-4">
            <label for="motDePasse" class="form-label">Mot de passe</label>
            <div class="input-group has-validation">
              <input id="motDePasse" class="form-control" formControlName="motDePasse"
                     autocomplete="current-password" [type]="motDePasseVisible() ? 'text' : 'password'"
                     [class.is-invalid]="formulaire.controls.motDePasse.touched && formulaire.controls.motDePasse.invalid">
              <button class="btn btn-outline-secondary" type="button" (click)="basculerMotDePasse()"
                      [attr.aria-label]="motDePasseVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'"
                      [attr.aria-pressed]="motDePasseVisible()">
                {{ motDePasseVisible() ? '🙈' : '👁' }}
              </button>
              <div class="invalid-feedback">Le mot de passe est obligatoire.</div>
            </div>
          </div>
          <button type="submit" class="btn btn-dark w-100" [disabled]="envoi()">
            @if (envoi()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Se connecter
          </button>
        </form>

        <p class="text-center small mt-4 mb-0">
          Pas encore de compte ?
          <a routerLink="/inscription" [queryParams]="{ retour: retour }">Créer un compte</a>
        </p>
      </div>
    </div>
  </div>
</div>
