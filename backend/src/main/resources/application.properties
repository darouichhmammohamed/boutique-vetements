spring.application.name=backend
spring.config.import=optional:classpath:application-secret.properties

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/boutique_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-heures=24
app.cors.origines=http://localhost:4200
app.admin.email=admin@boutique.com
app.admin.mot-de-passe=${ADMIN_PASSWORD:Admin123!}
